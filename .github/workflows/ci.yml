name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (Elixir ${{ matrix.elixir }}, OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: "1.20"
            otp: "29"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # The :schema tests validate generated XML against the SpreadsheetML schema.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Restore schemas cache
        id: schemas
        uses: actions/cache@v4
        with:
          path: test/schemas
          key: schemas-${{ hashFiles('scripts/fetch_schemas.sh') }}

      - name: Fetch schemas
        if: steps.schemas.outputs.cache-hit != 'true'
        run: scripts/fetch_schemas.sh

      # The :interop tests (openpyxl, LibreOffice) are left out here; they are
      # excluded automatically when uv and soffice are not installed.
      - name: Run tests
        run: mix test
